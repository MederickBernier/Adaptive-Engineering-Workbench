[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "adaptive-engineering-workbench"
version = "0.1.0"
description = "Prototype engine for the Adaptive Engineering Workbench"
requires-python = ">=3.13"

[project.optional-dependencies]
dev = [
    "jsonschema>=4.23,<5",
    "pytest>=8.3,<9",
    "ruff>=0.11,<1",
]

[tool.setuptools.packages.find]
include = ["engine", "engine.*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py313"
